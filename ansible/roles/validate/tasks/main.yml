---
- name: Validate NGINX configuration
  ansible.builtin.command:
    cmd: docker compose exec -T nginx nginx -t
    chdir: "{{ project_dir }}"
  register: nginx_config_check
  changed_when: false
  when: not ansible_check_mode

- name: Display NGINX validation result
  ansible.builtin.debug:
    msg: "{{ nginx_config_check.stderr }}"
  when: not ansible_check_mode

- name: Validate Prometheus configuration
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T prometheus
      promtool check config /etc/prometheus/prometheus.yml
    chdir: "{{ project_dir }}"
  register: prometheus_config_check
  changed_when: false
  when: not ansible_check_mode

- name: Display Prometheus configuration validation
  ansible.builtin.debug:
    msg: "{{ prometheus_config_check.stdout }}"
  when: not ansible_check_mode

- name: Wait for HTTP service to become available
  ansible.builtin.uri:
    url: "{{ service_url }}"
    method: GET
    status_code: 200
    return_content: true
  register: service_response
  retries: 10
  delay: 3
  until: service_response.status == 200
  when: not ansible_check_mode

- name: Display service response
  ansible.builtin.debug:
    var: service_response.json
  when: not ansible_check_mode

- name: Wait for Prometheus to become ready
  ansible.builtin.uri:
    url: http://localhost:9090/-/ready
    method: GET
    status_code: 200
  register: prometheus_response
  retries: 10
  delay: 3
  until: prometheus_response.status == 200
  when: not ansible_check_mode

- name: Wait for Grafana to become healthy
  ansible.builtin.uri:
    url: http://localhost:3000/api/health
    method: GET
    status_code: 200
    return_content: true
  register: grafana_response
  retries: 10
  delay: 3
  until: grafana_response.status == 200
  when: not ansible_check_mode

- name: Display validation summary
  ansible.builtin.debug:
    msg:
      - "NGINX configuration: OK"
      - "Prometheus configuration: OK"
      - "Application: OK"
      - "Prometheus readiness: OK"
      - "Grafana: {{ grafana_response.json.database | default('OK') }}"
  when: not ansible_check_mode