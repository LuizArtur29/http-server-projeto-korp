name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Validate Docker Compose
        run: docker compose config

      - name: Create Docker network
        run: docker network create korp-network

      - name: Build application image
        run: docker build -t http-server-projeto-korp:local .

      - name: Start stack
        run: docker compose up -d

      - name: Show container status
        run: docker compose ps

      - name: Validate NGINX configuration
        run: docker compose exec -T nginx nginx -t

      - name: Validate Prometheus configuration
        run: |
          docker compose exec -T prometheus \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Wait for application
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost/projeto-korp > /tmp/response.json; then
              cat /tmp/response.json
              exit 0
            fi

            sleep 3
          done

          echo "Application did not become ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Wait for Prometheus readiness
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:9090/-/ready; then
              echo
              echo "Prometheus is ready"
              exit 0
            fi

            echo "Waiting for Prometheus... attempt ${i}/20"
            sleep 3
          done

          echo "Prometheus did not become ready"
          docker compose ps
          docker compose logs prometheus
          exit 1

      - name: Wait for Grafana health
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo
              echo "Grafana is healthy"
              exit 0
            fi

            echo "Waiting for Grafana... attempt ${i}/20"
            sleep 3
          done

          echo "Grafana did not become healthy"
          docker compose ps
          docker compose logs grafana
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down