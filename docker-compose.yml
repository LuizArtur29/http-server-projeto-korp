services:
  http-server-projeto-korp:
    image: http-server-projeto-korp:local
    networks:
      - korp-network
    expose:
      - "8080"

  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - korp-network
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - korp-network
    depends_on:
      - http-server-projeto-korp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - "--spider"
        - "-q"
        - "http://localhost:9090/-/ready"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - korp-network
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://localhost:3000/api/health || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

networks:
  korp-network:
    name: korp-network
    external: true